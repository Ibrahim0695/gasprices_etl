x-airflow-common: &airflow-common
  image: gasprices-airflow:2.10.5
  restart: unless-stopped
  env_file:
    - .env
  environment:
    AIRFLOW__CORE__EXECUTOR: SequentialExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__LAZY_DISCOVER_PROVIDERS: "true"
    AIRFLOW__CORE__LAZY_LOAD_PLUGINS: "true"
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: "1"
    AIRFLOW__WEBSERVER__WORKERS: "1"
    AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: "600"
    AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: "600"
    AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-}
    DATABASE_HOST: host.docker.internal
  volumes:
    - airflow-data:/opt/airflow
    - ./dags:/opt/airflow/dags
    - ./main.py:/opt/airflow/project/main.py
    - ./extract.py:/opt/airflow/project/extract.py
    - ./transform.py:/opt/airflow/project/transform.py
    - ./load.py:/opt/airflow/project/load.py
    - ./pipeline.py:/opt/airflow/project/pipeline.py

services:
  airflow-init:
    <<: *airflow-common
    build: .
    command:
      - bash
      - -c
      - |
        set -e
        airflow db migrate
        if ! python -c 'import sqlite3, sys; db = sqlite3.connect("/opt/airflow/airflow.db"); sys.exit(0 if db.execute("SELECT 1 FROM ab_user WHERE username = ?", (sys.argv[1],)).fetchone() else 1)' "$${AIRFLOW_ADMIN_USERNAME}"; then
          if [ -z "$${AIRFLOW_ADMIN_PASSWORD}" ]; then
            echo "Set AIRFLOW_ADMIN_PASSWORD in .env to create the Airflow admin user." >&2
            exit 1
          fi
          airflow users create \
            --username "$${AIRFLOW_ADMIN_USERNAME}" \
            --password "$${AIRFLOW_ADMIN_PASSWORD}" \
            --firstname Airflow \
            --lastname Admin \
            --role Admin \
            --email admin@example.com
        fi
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    entrypoint:
      - /usr/bin/dumb-init
      - --
      - airflow
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8081:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  airflow-scheduler:
    <<: *airflow-common
    entrypoint:
      - /usr/bin/dumb-init
      - --
      - airflow
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-data:
